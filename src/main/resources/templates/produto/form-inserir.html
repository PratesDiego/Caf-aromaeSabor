<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Inserir Produto - Café Aroma e Sabor</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <div class="header-container">
        <div class="logo">Café Aroma e Sabor</div>
        <nav>
            <ul>
                <li><a th:href="@{/home}">Home</a></li>
                <li><a th:href="@{/produto}">Produtos</a></li>
                <li><a th:href="@{/estoque}">Estoque</a></li>
                <li sec:authorize="isAnonymous()"><a th:href="@{/login}">Login</a></li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn logout-btn" style="background:none;border:none;padding:0;color:inherit;cursor:pointer;">Logout</button>
                    </form>
                </li>
            </ul>
        </nav>
    </div>
</header>
<main>
    <div class="container">
        <h1>Inserir Novo Produto</h1>
        <p>Adicione um novo produto ao catálogo.</p>
        <div th:if="${msg}" class="alert alert-success" th:text="${msg}" style="margin-bottom:1rem;"></div>
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}" style="color: #b71c1c; margin-bottom:1rem;"></div>
        <form th:action="@{/produto}" method="post" th:object="${produto}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label for="nome">Nome do Produto:</label>
                <input type="text" id="nome" th:field="*{nome}" required placeholder="Ex: Café Expresso">
                <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color:#b71c1c;font-size:0.9rem;"></div>
            </div>
            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" th:field="*{preco}" step="0.01" required placeholder="5.00">
                <div th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}" style="color:#b71c1c;font-size:0.9rem;"></div>
            </div>
            <div class="form-group">
                <label for="quantidadeEstoque">Quantidade em Estoque:</label>
                <input type="number" id="quantidadeEstoque" th:field="*{quantidadeEstoque}" required placeholder="100">
                <div th:if="${#fields.hasErrors('quantidadeEstoque')}" th:errors="*{quantidadeEstoque}" style="color:#b71c1c;font-size:0.9rem;"></div>
            </div>
            <div class="form-group">
                <label for="quantidadeMinima">Estoque Mínimo:</label>
                <input type="number" id="quantidadeMinima" th:field="*{quantidadeMinima}" required placeholder="10">
                <div th:if="${#fields.hasErrors('quantidadeMinima')}" th:errors="*{quantidadeMinima}" style="color:#b71c1c;font-size:0.9rem;"></div>
            </div>
            <div class="form-group">
                <label for="descricao">Descrição:</label>
                <textarea id="descricao" th:field="*{descricao}" rows="4" placeholder="Descreva o produto..."></textarea>
            </div>
            <div class="form-group">
                <label for="categoria">Categoria:</label>
                <select id="categoria" th:field="*{categoria}">
                    <option value="">Selecione uma categoria</option>
                    <option value="Café">Café</option>
                    <option value="Doce">Doce</option>
                    <option value="Salgado">Salgado</option>
                </select>
            </div>
            <button type="submit" class="btn">Salvar Produto</button>
        </form>
        <br>
        <a th:href="@{/produto}">Voltar para Listagem</a>
    </div>
</main>
<footer>
    <div class="footer-container">
        <p>&copy; 2026 Café Aroma e Sabor. Todos os direitos reservados.</p>
    </div>
</footer>
</body>
</html>
